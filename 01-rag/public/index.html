<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Site Archive — local RAG</title>
<style>
  :root {
    --ink: #14171c;
    --panel: #1b1f27;
    --panel-2: #20242e;
    --line: #2c313d;
    --paper: #e8e6df;
    --muted: #8b93a1;
    --amber: #c98a4b;
    --amber-dim: #6e4f2d;
    --font-display: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--font-body);
  }

  .layout {
    display: grid;
    grid-template-columns: 1fr 300px;
    grid-template-rows: auto 1fr;
    height: 100%;
    max-width: 1100px;
    margin: 0 auto;
  }

  header {
    grid-column: 1 / -1;
    padding: 22px 24px 16px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  header h1 {
    font-family: var(--font-display);
    font-weight: normal;
    font-size: 22px;
    margin: 0;
    letter-spacing: 0.2px;
  }

  header h1 span {
    color: var(--amber);
    font-style: italic;
  }

  header .meta {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  main {
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  aside {
    border-left: 1px solid var(--line);
    padding: 24px 20px;
    overflow-y: auto;
  }

  aside h2 {
    font-family: var(--font-mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin: 0 0 14px;
  }

  .source-chip {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--paper);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-left: 3px solid var(--amber);
    padding: 8px 10px;
    border-radius: 2px;
    margin-bottom: 8px;
    word-break: break-all;
    line-height: 1.4;
  }

  .source-chip a {
    color: inherit;
    text-decoration: none;
  }

  .source-chip a:hover { color: var(--amber); }

  .empty-note {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 16px 18px;
    max-width: 640px;
  }

  .card.user {
    align-self: flex-end;
    background: var(--panel-2);
  }

  .card.assistant {
    position: relative;
    border-top: 2px dashed var(--amber-dim);
  }

  .card .role {
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .card .body {
    font-family: var(--font-display);
    font-size: 16px;
    line-height: 1.55;
    white-space: pre-wrap;
  }

  .card.user .body {
    font-family: var(--font-body);
    font-size: 15px;
  }

  form {
    grid-column: 1 / -1;
    display: flex;
    gap: 10px;
    padding: 16px 24px 22px;
    border-top: 1px solid var(--line);
  }

  input[type="text"] {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--paper);
    padding: 12px 14px;
    border-radius: 3px;
    font-size: 14px;
    font-family: var(--font-body);
  }

  input[type="text"]:focus {
    outline: none;
    border-color: var(--amber);
  }

  button {
    background: var(--amber);
    color: #201305;
    border: none;
    padding: 0 20px;
    border-radius: 3px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }

  button:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .loading {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
  }

  @media (max-width: 720px) {
    .layout { grid-template-columns: 1fr; }
    aside { border-left: none; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
  <div class="layout">
    <header>
      <h1>Site <span>Archive</span></h1>
      <div class="meta" id="statusLine">local rag · ollama + chroma</div>
    </header>

    <main id="thread">
      <div class="empty-note">
        Ask a question about the content of the indexed site. Answers are built only
        from the retrieved fragments — the sources will appear on the right.
      </div>
    </main>

    <aside>
      <h2>Sources for the latest answer</h2>
      <div id="sources">
        <div class="empty-note">Nothing yet.</div>
      </div>
    </aside>

    <form id="askForm">
      <input type="text" id="questionInput" placeholder="Ask something about the site…" autocomplete="off" />
      <button type="submit" id="askButton">Ask</button>
    </form>
  </div>

  <script>
    const thread = document.getElementById('thread');
    const sourcesEl = document.getElementById('sources');
    const form = document.getElementById('askForm');
    const inputEl = document.getElementById('questionInput');
    const button = document.getElementById('askButton');
    let firstMessage = true;

    function addCard(role, text) {
      if (firstMessage) {
        thread.innerHTML = '';
        firstMessage = false;
      }
      const card = document.createElement('div');
      card.className = `card ${role}`;
      const roleLabel = document.createElement('div');
      roleLabel.className = 'role';
      roleLabel.textContent = role === 'user' ? 'Question' : 'Answer';
      const body = document.createElement('div');
      body.className = 'body';
      body.textContent = text;
      card.append(roleLabel, body);
      thread.appendChild(card);
      thread.scrollTop = thread.scrollHeight;
      return card;
    }

    function renderSources(sources) {
      sourcesEl.innerHTML = '';
      if (!sources || sources.length === 0) {
        sourcesEl.innerHTML = '<div class="empty-note">No sources found.</div>';
        return;
      }
      for (const url of sources) {
        const chip = document.createElement('div');
        chip.className = 'source-chip';
        chip.innerHTML = `<a href="${url}" target="_blank" rel="noopener">${url}</a>`;
        sourcesEl.appendChild(chip);
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = inputEl.value.trim();
      if (!question) return;

      addCard('user', question);
      inputEl.value = '';
      button.disabled = true;
      const loadingCard = addCard('assistant', 'Searching the index and thinking about the answer…');
      loadingCard.querySelector('.body').classList.add('loading');

      try {
        const res = await fetch('/api/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question }),
        });
        const data = await res.json();

        loadingCard.querySelector('.body').classList.remove('loading');
        if (!res.ok) {
          loadingCard.querySelector('.body').textContent = `Error: ${data.error || res.statusText}`;
        } else {
          loadingCard.querySelector('.body').textContent = data.answer;
          renderSources(data.sources);
        }
      } catch (err) {
        loadingCard.querySelector('.body').classList.remove('loading');
        loadingCard.querySelector('.body').textContent = `Network error: ${err.message}`;
      } finally {
        button.disabled = false;
        inputEl.focus();
      }
    });
  </script>
</body>
</html>
